[project]
name = "dronerl-workshop"
version = "0.1.0"
description = "Reinforcement Learning workshop: multi-agent drone deliveries environment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=1.0",
    "Pillow>=11.0",
    "tqdm>=4.66",
    "seaborn>=0.13",
    "matplotlib>=3.9",
    "numpy>=2.1",
    "torch>=2.5",
    "torchvision>=0.20",
    "pandas>=2.2",
    "moviepy>=2.1",
]

[dependency-groups]
dev = [
    "jupyter>=1.1",
    "ipykernel>=6.29",
]
# Optional: TensorBoard logging (notebook 03) and AIcrowd submission upload.
# Not required to run the workshop notebooks. Install with: uv sync --group extras
extras = [
    "tensorflow>=2.16",
    "tensorboard>=2.16",
    "boto3>=1.34",
]

[tool.uv]
# Notebook-based workshop run from the repo root; not built/installed as a package.
package = false
